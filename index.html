<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sunny Socks</title>
</head>
<body>
<!-- Menu bar -->
    <header class="header">
        <img src="/images/sunny-socks-logo.png" alt="Sunny Socks logo">
        <div class="header-page">
            <p>Home</p>
            <p>Shop</p>
            <p>Order</p>
            <p>About</p>
        </div>
        <div class="header-button">
            <a href="#">
                <span>🛒</span>
                <p>Basket</p>
                <span>0</span>
            </a>

            <a href="#">
                <span>🌙</span>
            </a>
            <!-- language change -->
            <details>
                <summary>🌐 EN</summary>
                <p>🇬🇧 English</p>
                <p>🇳🇱 Nederlands</p>
            </details>

            <details>
                <summary>🔍 Search</summary>
            </details>

        </div>
    </header>
<!-- hero image section -->
    <section>
        <div class="hero-page">
            <p>Sunny Socks</p>
            <p>Colourful socks for work, home, sport & a greener world.</p>
            <p>Shop the Collection</p>
            <p>Our Story</p>
        </div>
    </section>

    <section>
        <div class="home-discount">
            <p>☀️ FREE SHIPPING OVER $45 • CODE: SUNNYSOCKS2026</p>
        </div>
    </section>

    <section>
        <div class="home-category">
            <p>Shop by Category</p>
            <p>View all→</p>
            <div class="home-category-cards">
                <div class="home-category-card">
                    box1
                </div>
                <div class="home-category-card">
                    box2
                </div>
                <div class="home-category-card">
                    box3
                </div>
                <div class="home-category-card">
                    box4
                </div>
            </div>
        </div>
    </section>

    <section>
        <div class="home-bestseller">
            <div class="home-bestseller-card">
                box1
            </div>
            <div class="home-order-card">
                box2
            </div>
        </div>
    </section>

</body>
</html>
