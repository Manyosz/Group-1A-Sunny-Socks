<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Socks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shop-page">
    <header class="shop-heading">
      <div>
        <p class="eyebrow">THE SOCK SHOP</p>
        <h1>Find your happy feet.</h1>
        <p class="intro">Everyday comfort, with a little personality.</p>
      </div>
      <div class="heading-actions"><span class="item-count" id="itemCount" aria-live="polite">6 products</span><span class="bag-indicator">Bag <span id="bagCount">0</span></span></div>
    </header>

    <section class="filter-bar" aria-label="Shop filters">
      <div class="category-list" id="categoryList">
        <button class="filter-chip active" data-category="All" aria-pressed="true">All</button>
        <button class="filter-chip" data-category="Athletic" aria-pressed="false">Athletic</button>
        <button class="filter-chip" data-category="Casual" aria-pressed="false">Casual</button>
        <button class="filter-chip" data-category="Hiking" aria-pressed="false">Hiking</button>
        <button class="filter-chip" data-category="Cozy" aria-pressed="false">Cozy</button>
        <button class="filter-chip" data-category="Sale" aria-pressed="false">Sale</button>
      </div>
      <label class="sort-wrap">
        <span class="sr-only">Sort products</span>
        <select id="sortSelect" aria-label="Sort products">
          <option value="newest">Sort: Newest</option>
          <option value="name-asc">Name: A–Z</option>
          <option value="name-desc">Name: Z–A</option>
          <option value="price-asc">Price: Low–High</option>
          <option value="price-desc">Price: High–Low</option>
        </select>
      </label>
    </section>

    <section class="product-panel" aria-label="Products">
      <div class="product-grid" id="productGrid"></div>
      <p class="empty-state" id="emptyState" hidden>No products in this category yet.</p>
      <nav class="pagination" id="pagination" aria-label="Product pages"></nav>
    </section>
    <footer class="shop-footer">Made for SunnyGroup-1A Team by Kaylen <span aria-hidden="true">♥</span></footer>
  </main>
  <section class="modal-overlay" id="productModal" role="dialog" aria-modal="true" aria-labelledby="detailName" hidden>
    <div class="product-modal">
      <button class="close-modal" id="closeModal" type="button" aria-label="Close product details">×</button>
      <div class="modal-image-wrap"><img class="modal-image" id="detailImage" src="" alt=""></div>
      <div class="modal-content">
        <p class="detail-category" id="detailCategory"></p><span class="detail-badge" id="detailBadge"></span>
        <h2 class="detail-name" id="detailName"></h2><p class="detail-price" id="detailPrice"></p>
        <p class="detail-description" id="detailDescription"></p>
        <div class="detail-specs">
          <div class="detail-spec"><strong>Material</strong><span id="detailMaterial"></span></div>
          <div class="detail-spec"><strong>Fit</strong><span id="detailFit"></span></div>
          <div class="detail-spec"><strong>Colour</strong><span id="detailColor"></span></div>
          <div class="detail-spec"><strong>Shipping</strong><span>Calculated at checkout</span></div>
        </div>
        <p class="size-heading">Choose your size</p><div class="detail-sizes" id="detailSizes"></div>
        <p class="size-message" id="sizeMessage" aria-live="polite">Choose a size to continue.</p>
        <button class="add-to-bag" id="addToBag" type="button" disabled>Add to bag</button>
      </div>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
